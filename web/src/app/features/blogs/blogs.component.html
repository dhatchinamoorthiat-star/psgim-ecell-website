<!-- Editorial Landing Page Hero -->
<section class="blogs-hero wrap" revealOnScroll>
  <span class="hero-eyebrow">{{ meta.eyebrow }}</span>
  <h1 class="hero-title">{{ meta.title }}</h1>
  <p class="hero-subtitle">{{ meta.subtitle }}</p>
</section>

<!-- 4-Stage Series Pathway Component -->
<app-blog-series-pathway [activePart]="0" revealOnScroll />

<!-- Flagship Series Feature Section -->
<section class="series-section wrap" revealOnScroll>
  <div class="section-title-row">
    <div>
      <span class="kicker">FLAGSHIP SERIES</span>
      <h2 class="sec-heading">From Idea to Impact</h2>
    </div>
  </div>

  <!-- Large Featured Article (Part 1) -->
  @if (featuredArticle) {
    <app-featured-blog-card [article]="featuredArticle" />
  }

  <!-- Secondary Series Articles (Parts 2, 3, 4) -->
  <div class="section-title-row" style="margin-top: var(--s-8)">
    <div>
      <span class="kicker">SERIES PROGRESSION</span>
      <h2 class="sec-heading">Parts 2, 3 & 4</h2>
    </div>
  </div>

  <div class="articles-grid" appStagger childSelector="app-blog-card">
    @for (art of remainingArticles; track art.id) {
      <app-blog-card [article]="art" />
    }
  </div>
</section>
