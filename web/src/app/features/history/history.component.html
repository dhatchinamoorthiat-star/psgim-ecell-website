<section class="hero wrap" revealOnScroll>
  <span class="kicker">{{ timeline.kicker }}</span>
  <h1>{{ timeline.heading }}</h1>
</section>

<section class="section wrap" revealOnScroll>
  <ui-pending-flag *ngIf="timeline.pending" [label]="timeline.note" style="display:inline-block; margin-bottom: var(--s-6)"></ui-pending-flag>
  <app-editorial-timeline [entries]="timelineEntries"></app-editorial-timeline>
</section>
