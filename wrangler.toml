# Cloudflare Pages configuration.
#
# `pages_build_output_dir` is all Pages needs: build the Angular app with
# `npm run build` (from web/, or via the root `npm run build` below), then
# `npx wrangler pages deploy` uploads web/dist/web/browser.
#
# Angular's build now requires `npm install` — the site is no longer
# dependency-free the way the old hand-rolled build.mjs generator was. That's
# an intentional tradeoff of the Angular migration, not an oversight.
#
# web/tools/postbuild.mjs runs after `ng build` (wired into `web`'s own
# `npm run build`) to (re)generate sitemap.xml and robots.txt into the
# prerendered output; _headers ships from web/public/_headers and is copied
# through by the Angular build as a static asset.

# IMPORTANT — the production branch of this project is `ECell`, not `main`.
# Deploying with `--branch main` publishes to main.psgim-ecell.pages.dev,
# which is a *preview* alias; psgim-ecell.pages.dev would not change and the
# command would still report success. `npm run deploy` uses the right branch.
#
# Every other branch name becomes its own alias:
#   <branch>.psgim-ecell.pages.dev   (lowercased, non-alphanumerics → "-",
#                                     truncated to 28 characters)
# and every single deployment also gets <8-char-id>.psgim-ecell.pages.dev.

name = "psgim-ecell"
pages_build_output_dir = "web/dist/web/browser"
compatibility_date = "2026-09-22"
