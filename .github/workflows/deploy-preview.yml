# Manual PREVIEW deployment to Cloudflare Pages (ADR-009).
#
# - Triggered by hand only; never on push.
# - Refuses any label that is not ^[a-z0-9-]+$, or that is the production
#   label `ECell` in any case/hyphenation (tools/validate-preview-label.mjs,
#   review finding F13): production deployment is gated by N-1/N-6 in
#   docs/PHASE_1_AUTHORIZATION.md and must get its own workflow once
#   authorized.
# - Needs repository secrets CLOUDFLARE_API_TOKEN (Pages:Edit only) and
#   CLOUDFLARE_ACCOUNT_ID. Until they exist this workflow simply fails.
name: Deploy preview (manual)

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Preview label → <label>.psgim-ecell.pages.dev (not ECell)"
        required: true
        default: platform-preview

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate preview label
        env:
          LABEL: ${{ inputs.label }}
        run: node tools/validate-preview-label.mjs "$LABEL"
      - run: npm ci --prefix web
      - run: npm --prefix web run build
      - name: Nothing uncommitted is deployed
        run: test -z "$(git status --porcelain)"
      - name: Deploy to preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LABEL: ${{ inputs.label }}
        run: >
          npx wrangler pages deploy web/dist/web/browser
          --project-name psgim-ecell
          --branch "$LABEL"
          --commit-hash "$GITHUB_SHA"
          --commit-message "preview from $GITHUB_REF_NAME"
