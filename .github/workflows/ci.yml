# Continuous integration (ADR-009). Validates only — it deploys nothing.
# Production deployment is not authorized yet (docs/PHASE_1_AUTHORIZATION.md).
name: CI

on:
  push:
    branches: [main, "platform/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ecell
          POSTGRES_USER: ecell
          POSTGRES_PASSWORD: ecell
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecell -d ecell"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://ecell:ecell@localhost:5432/ecell
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: System checks
        run: python manage.py check
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (incl. RBAC escalation suite)
        run: pytest

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint (platform code)
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Build (prerender + postbuild)
        run: npm run build
      - name: Build leaves the tree clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  functions:
    name: Cloudflare /api proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test "tools/tests/*.test.mjs"
