<!doctype html>
<!--
  Turns the supplied logo.jpeg (blue artwork on a white background) into a
  tight, transparent PNG.

  Run by tools/make-logo.mjs, which loads this twice: once with ?probe=1 to
  read the artwork's bounding box out of the DOM, then again at exactly that
  size so the screenshot is a pixel-tight crop.

  The keying is a proper white-matte removal, not a colour-range cut:

      alpha = 1 - min(r,g,b)/255
      rgb   = (rgb - 255*(1-alpha)) / alpha

  That is the algebraic inverse of "artwork composited over white", so
  anti-aliased edges keep their true colour and their partial alpha instead of
  picking up a white fringe — which is what a plain "make white transparent"
  threshold produces, and it shows badly against the navy footer.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<script>
const params = new URLSearchParams(location.search);
const PROBE = params.has("probe");
const OUT   = Number(params.get("size") || 512);

const img = new Image();
img.src = "source/logo-new.png";

img.onload = () => {
  const w = img.naturalWidth, h = img.naturalHeight;
  const src = document.createElement("canvas");
  src.width = w; src.height = h;
  const sctx = src.getContext("2d", { willReadFrequently: true });
  sctx.drawImage(img, 0, 0);

  const data = sctx.getImageData(0, 0, w, h);
  const p = data.data;

  let minX = w, minY = h, maxX = -1, maxY = -1;

  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b = p[i + 2];
    // Alpha from how far the darkest channel is below white.
    let a = 1 - Math.min(r, g, b) / 255;

    // JPEG ringing leaves the "white" field a point or two off pure white;
    // anything this faint is background, not artwork.
    if (a < 0.02) { p[i + 3] = 0; continue; }

    // Undo the white matte so edge pixels carry the artwork's own colour.
    p[i]     = Math.max(0, Math.min(255, (r - 255 * (1 - a)) / a));
    p[i + 1] = Math.max(0, Math.min(255, (g - 255 * (1 - a)) / a));
    p[i + 2] = Math.max(0, Math.min(255, (b - 255 * (1 - a)) / a));
    p[i + 3] = Math.round(a * 255);

    // Bounding box of everything that survived, for the tight crop.
    const px = (i / 4) % w, py = Math.floor((i / 4) / w);
    if (px < minX) minX = px;
    if (px > maxX) maxX = px;
    if (py < minY) minY = py;
    if (py > maxY) maxY = py;
  }
  sctx.putImageData(data, 0, 0);

  const bw = maxX - minX + 1, bh = maxY - minY + 1;

  if (PROBE) {
    // make-logo.mjs reads these back with --dump-dom.
    document.body.dataset.bbox = [minX, minY, bw, bh].join(",");
    document.title = `${bw}x${bh}`;
    return;
  }

  // Scale the tight crop so its longest side is OUT.
  const scale = OUT / Math.max(bw, bh);
  const cw = Math.round(bw * scale), ch = Math.round(bh * scale);

  const out = document.createElement("canvas");
  out.width = cw; out.height = ch;
  const octx = out.getContext("2d");
  octx.imageSmoothingQuality = "high";
  octx.drawImage(src, minX, minY, bw, bh, 0, 0, cw, ch);

  document.body.style.width = cw + "px";
  document.body.style.height = ch + "px";
  document.body.appendChild(out);
  document.title = `${cw}x${ch}`;
};
</script>
</body>
</html>
